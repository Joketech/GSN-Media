name: Build GSN containers
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            dockerfile: Dockerfile
          - component: voice
            dockerfile: services/Dockerfile.voice
          - component: visuals
            dockerfile: services/Dockerfile.visuals
    steps:
      - uses: actions/checkout@v4
      - name: Validate app and worker source
        run: |
          node --check server.mjs
          node --check ai-proxy.mjs
          node --check ai-studio.js
          node --check media.js
          node --check v1-api.mjs
          node --check v1.js
          node --test tests/v1.test.mjs
          python3 -m py_compile services/inference_worker.py
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine lowercase image namespace
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.component }}:latest
            ${{ steps.image.outputs.prefix }}/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
