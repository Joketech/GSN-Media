name: Validate source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and Compose
        run: |
          node --check server.mjs
          node --check studio.js
          node --check ai-studio.js
          node --check ai-proxy.mjs
          node --check v1-api.mjs
          node --check v1.js
          node --check template-engine.mjs
          node --check template-kit.mjs
          node --check designs-api.mjs
          node --check platforms.mjs
          node --check app.js
          node --check kit-host.js
          node --check library.js
          node --check dashboard.js
          node --check editor.js
          node --check people.js
          node --check exporter.js
          node --check water.js
          node --check composer.js
          node --check publisher.mjs
          node --check schedule.js
          node --check team.js
          node --check accounts.mjs
          node --check globe.js
          node --test tests/v1.test.mjs tests/designs.test.mjs tests/publish.test.mjs tests/cutout.test.mjs tests/accounts.test.mjs
          python3 -m py_compile services/inference_worker.py
          python3 -m py_compile services/cutout_worker.py
          python3 -m py_compile integrations/hermes/gsn.py
          python3 tests/worker_idempotency.py
          python3 integrations/hermes/gsn.py --help
          docker compose --profile voice --profile gpu --profile public config --quiet
          bash -n deploy/preflight.sh
          bash -n deploy/update.sh
          bash -n deploy/setup-v1.sh
