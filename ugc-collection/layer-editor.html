<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSN UGC · Independent layers</title><link rel="stylesheet" href="layer-editor.css">
<body><header><a href="./">← Collection</a><strong id="campaign-name">Independent layers</strong><button id="undo" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button><button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button><span id="save-status" role="status">Loading…</span><button id="export">Download PNG</button></header>
<main><aside class="layers-panel"><h2>Layers</h2><p class="hint">Select one object to change it. Drag on the canvas; double-click text to type.</p><label id="composition-control" hidden>Product arrangement<select id="composition"><option value="">Choose an optional arrangement</option><option value="product">Product arrangement</option></select></label><div id="layers"></div><div class="actions"><button id="add-text">＋ Text</button><button id="add-image">＋ Image</button></div><h3>Background</h3><div class="actions"><button id="bg-upload">Upload / phone</button><button id="bg-library">Studio pictures</button></div><div class="bg-row"><label>Colour <input type="color" id="bg-colour" value="#f2e8dc"></label><label>Gradient <input type="color" id="bg-grad-a" value="#f6d6b8"><input type="color" id="bg-grad-b" value="#8a3b2a"></label></div><label class="bg-ai">Generate from words<textarea id="bg-prompt" rows="3" maxlength="800" placeholder="e.g. warm terracotta studio wall, soft morning light, a small plant in the corner"></textarea></label><p class="hint" id="bg-cost">Checking the cost…</p><button id="bg-generate">Generate background</button><div id="bg-gallery" class="bg-gallery" hidden></div><h3>Campaign instructions</h3><textarea id="brief" rows="4" maxlength="4000" placeholder="Tell Mira the product, audience, offer and what should change…"></textarea><button id="ask-mira">Send brief to Mira</button><p class="hint" id="agent-status">Hermes must be connected to complete an agent request.</p><button id="export-doc">Save editable project (JSON)</button><button id="import-doc">Open editable project (JSON)</button><button id="import-plan">Apply agent plan JSON</button></aside>
<section class="workspace"><div class="canvas-wrap"><div id="canvas" class="canvas" aria-label="Editable UGC design"></div></div><footer><button id="collapse">Collapse layers</button><label>Zoom <input id="zoom" type="range" min="35" max="150" value="70"><output id="zoom-value">70%</output></label><span>1080 × 1350 · One page</span></footer></section>
<aside class="properties"><h2 id="selected-name">Select a layer</h2><div id="properties"></div><p class="hint" id="message" role="status"></p><button id="reset" class="quiet">Restore this layered starter</button></aside></main>
<input type="file" id="image-file" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="plan-file" accept="application/json,.json" hidden>
<script src="data.js"></script><script type="module" src="layer-editor.mjs"></script></body></html>
