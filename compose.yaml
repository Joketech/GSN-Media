name: gsn-studio
# Rotate container logs so a long-running VPS cannot fill its disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  app:
    build: .
    image: gsn-studio-app:local
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${APP_PORT:-4188}:4187"
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "4187"
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      VOICE_WORKER_URL: ${VOICE_WORKER_URL:-http://voice:8091}
      VISUAL_WORKER_URL: ${VISUAL_WORKER_URL:-http://visuals:8091}
      CUTOUT_WORKER_URL: ${CUTOUT_WORKER_URL:-http://cutout:8092}
      IMAGE_GEN_PROVIDER: ${IMAGE_GEN_PROVIDER:-auto}
      IMAGE_GEN_KEY: ${IMAGE_GEN_KEY:-}
      IMAGE_GEN_URL: ${IMAGE_GEN_URL:-}
      IMAGE_GEN_MODEL: ${IMAGE_GEN_MODEL:-}
      IMAGE_GEN_QUALITY: ${IMAGE_GEN_QUALITY:-low}
      IMAGE_GEN_COST_NOTE: ${IMAGE_GEN_COST_NOTE:-}
      IMAGE_GEN_HOURLY_LIMIT: ${IMAGE_GEN_HOURLY_LIMIT:-40}
      GSN_AGENT_TOKEN: ${GSN_AGENT_TOKEN:-}
      GSN_REQUIRE_KEY: ${GSN_REQUIRE_KEY:-}
      POSTIZ_API_URL: ${POSTIZ_API_URL:-}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      POSTIZ_HOURLY_LIMIT: ${POSTIZ_HOURLY_LIMIT:-}
      GSN_DATA_DIR: /data
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  cutout:
    build:
      context: .
      dockerfile: services/Dockerfile.cutout
    image: gsn-studio-cutout:local
    restart: unless-stopped
    logging: *logging
    environment:
      NUMBA_CACHE_DIR: /tmp/numba
      HOME: /tmp
    expose: ["8092"]
    cpus: 3
    mem_limit: 4g
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  voice:
    profiles: [voice]
    build:
      context: .
      dockerfile: services/Dockerfile.voice
    restart: unless-stopped
    logging: *logging
    environment:
      WORKER_KIND: voice
      DATA_DIR: /data
      HF_HOME: /models
      VOICE_MODEL: Qwen/Qwen3-TTS-12Hz-0.6B-Base
      OMP_NUM_THREADS: "2"
    volumes:
      - voice-data:/data
      - voice-models:/models
    expose: ["8091"]
    cpus: 2
    mem_limit: 4g
    security_opt: ["no-new-privileges:true"]
  visuals:
    profiles: [gpu]
    build:
      context: .
      dockerfile: services/Dockerfile.visuals
    restart: unless-stopped
    logging: *logging
    gpus: all
    environment:
      WORKER_KIND: visuals
      DATA_DIR: /data
      HF_HOME: /models
      VIDEO_MODEL: Wan-AI/Wan2.2-TI2V-5B-Diffusers
      IMAGE_MODEL: stabilityai/stable-diffusion-xl-base-1.0
    volumes:
      - visual-data:/data
      - visual-models:/models
    expose: ["8091"]
    shm_size: 2gb
    cpus: 2
    mem_limit: 4g
    security_opt: ["no-new-privileges:true"]
  proxy:
    profiles: [public]
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-owner}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  app-data:
  voice-data:
  voice-models:
  visual-data:
  visual-models:
  caddy-data:
  caddy-config:
